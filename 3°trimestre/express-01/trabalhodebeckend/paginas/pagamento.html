<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportX - Checkout de Alta Performance</title>
    <style>
        /* Importando a mesma fonte robusta das páginas anteriores */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Mantendo a paleta de cores esportiva corporativa */
        :root {
            --bg-principal: #0B0C10;     /* Preto Carbono */
            --bg-secundario: #1F2833;    /* Grafite Escuro */
            --verde-neon: #00FF66;       /* Verde Destaque Principal */
            --verde-hover: #00CC52;      /* Verde Tom Escuro para Hover */
            --texto-claro: #FFFFFF;      /* Branco Puro */
            --texto-cinza: #C5C6C7;      /* Cinza de apoio */
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135px, rgba(11,12,16,1) 50%, rgba(0,255,102,0.05) 100%);
        }

        /* Layout em Duas Colunas */
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            width: 100%;
            max-width: 950px;
            background-color: var(--bg-secundario);
            border-radius: 8px;
            border-left: 6px solid var(--verde-neon);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }

        /* Coluna da Esquerda: Resumo */
        .order-summary {
            background-color: rgba(11, 12, 16, 0.5);
            padding: 40px 30px;
            border-right: 2px solid rgba(197, 198, 199, 0.05);
        }

        .order-summary h2 {
            font-size: 24px;
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .order-summary h2 span {
            color: var(--verde-neon);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(197, 198, 199, 0.1);
        }

        .item-info h4 {
            font-size: 16px;
            text-transform: uppercase;
        }

        .item-info p {
            font-size: 12px;
            color: var(--texto-cinza);
        }

        .item-price {
            font-weight: 700;
            color: var(--verde-neon);
        }

        .total-box {
            margin-top: 40px;
            padding: 20px;
            background-color: var(--bg-principal);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-box span {
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--texto-cinza);
        }

        .total-box .total-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--verde-neon);
            font-style: italic;
        }

        /* Coluna da Direita: Pagamento */
        .payment-form-box {
            padding: 40px 30px;
        }

        .payment-form-box h3 {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* Abas de método de pagamento */
        .payment-methods {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .method-btn {
            flex: 1;
            background-color: var(--bg-principal);
            border: 2px solid transparent;
            color: var(--texto-cinza);
            padding: 12px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-size: 13px;
        }

        .method-btn.active, .method-btn:hover {
            border-color: var(--verde-neon);
            color: var(--texto-claro);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        /* Estrutura de Inputs */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--texto-claro);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background-color: var(--bg-principal);
            border: 2px solid transparent;
            border-radius: 4px;
            padding: 12px 14px;
            color: var(--texto-claro);
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--verde-neon);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Botão Finalizar */
        .btn-pay {
            width: 100%;
            background-color: var(--verde-neon);
            color: var(--bg-principal);
            border: none;
            border-radius: 4px;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            font-style: italic;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.2);
            margin-top: 10px;
        }

        .btn-pay:hover {
            background-color: var(--verde-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 102, 0.4);
        }

        /* TELA DE AGRADECIMENTO (MODAL PUSH) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 12, 16, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .thanks-card {
            background-color: var(--bg-secundario);
            max-width: 500px;
            width: 90%;
            padding: 50px 40px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid var(--verde-neon);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
            transform: scale(0.8);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .thanks-card {
            transform: scale(1);
        }

        .thanks-icon {
            width: 70px;
            height: 70px;
            background-color: var(--verde-neon);
            color: var(--bg-principal);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: 800;
            margin: 0 auto 25px auto;
            box-shadow: 0 0 20px var(--verde-neon);
        }

        .thanks-card h2 {
            font-size: 32px;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .thanks-card h2 span {
            color: var(--verde-neon);
        }

        .thanks-card p {
            color: var(--texto-cinza);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-modal {
            background: transparent;
            border: 2px solid var(--verde-neon);
            color: var(--verde-neon);
            padding: 12px 30px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-modal:hover {
            background: var(--verde-neon);
            color: var(--bg-principal);
            box-shadow: 0 0 15px var(--verde-neon);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
            .order-summary {
                border-right: none;
                border-bottom: 2px solid rgba(197, 198, 199, 0.05);
            }
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- Coluna Esquerda: Resumo -->
        <div class="order-summary">
            <h2>Seu <span>Pedido</span></h2>
            
            <div class="item-row">
                <div class="item-info">
                    <h4>Plano Black Arena</h4>
                    <p>Acesso anual ilimitado + Mentoria</p>
                </div>
                <div class="item-price">R$ 89,90/mês</div>
            </div>

            <div class="item-row">
                <div class="item-info">
                    <h4>Kit Presilha SportX</h4>
                    <p>Brinde de boas-vindas</p>
                </div>
                <div class="item-price">Grátis</div>
            </div>

            <div class="total-box">
