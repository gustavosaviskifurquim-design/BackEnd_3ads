<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportX - Login do Atleta</title>
    <style>
        /* Importando a mesma fonte robusta da página inicial */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Mantendo a mesma paleta de cores esportiva */
        :root {
            --bg-principal: #0B0C10;     /* Preto Carbono */
            --bg-secundario: #1F2833;    /* Grafite Escuro/Container */
            --verde-neon: #00FF66;       /* Verde Destaque Principal */
            --verde-hover: #00CC52;      /* Verde Tom Escuro para Hover */
            --texto-claro: #FFFFFF;      /* Branco Puro */
            --texto-cinza: #C5C6C7;      /* Cinza de apoio */
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135px, rgba(11,12,16,1) 50%, rgba(0,255,102,0.08) 100%);
        }

        /* Container de Login */
        .login-container {
            background-color: var(--bg-secundario);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 8px;
            border-top: 5px solid var(--verde-neon);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Botão para voltar à Home */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--texto-cinza);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-back:hover {
            color: var(--verde-neon);
        }

        /* Cabeçalho do Card */
        .login-header {
            text-align: center;
            margin-bottom: 35px;
            margin-top: 10px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            color: var(--texto-claro);
            margin-bottom: 5px;
        }

        .logo span {
            color: var(--verde-neon);
        }

        .login-header p {
            color: var(--texto-cinza);
            font-size: 14px;
        }

        /* Estrutura do Formulário */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--texto-claro);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background-color: var(--bg-principal);
            border: 2px solid transparent;
            border-radius: 4px;
            padding: 14px 16px;
            color: var(--texto-claro);
            font-size: 14px;
            transition: 0.3s ease;
        }

        /* Efeito de foco esportivo nos inputs */
        .form-group input:focus {
            outline: none;
            border-color: var(--verde-neon);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        /* Links Úteis (Esqueceu a senha / Lembrar-me) */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--texto-cinza);
        }

        .remember-me input {
            accent-color: var(--verde-neon);
            cursor: pointer;
        }

        .forgot-password {
            color: var(--texto-cinza);
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-password:hover {
            color: var(--verde-neon);
        }

        /* Botão de Entrar (Esportivo) */
        .btn-login {
            width: 100%;
            background-color: var(--verde-neon);
            color: var(--bg-principal);
            border: none;
            border-radius: 4px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            font-style: italic;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.3);
        }

        .btn-login:hover {
            background-color: var(--verde-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 102, 0.5);
        }

        /* Rodapé de Cadastro */
        .login-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: var(--texto-cinza);
        }

        .login-footer a {
            color: var(--verde-neon);
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Botão Voltar -->
        <a href="index.html" class="btn-back">← Voltar</a>

        <!-- Logo e Boas-vindas -->
        <div class="login-header">
            <div class="logo">SPORT<span>X</span></div>
            <p>Insira suas credenciais para treinar</p>
        </div>

        <!-- Formulário de Login -->
        <form>
            <div class="form-group">
                <label for="email">E-mail ou Usuário</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha de Acesso</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Opções adicionais -->
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Lembrar de mim
                </label>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>

            <!-- Botão de Ação -->
            <button type="submit" class="btn-login">Entrar na Arena</button>
        </form>

        <!-- Cadastro rápido -->
        <div class="login-footer">
            Não tem uma conta? <a href="#">Cadastre-se</a>
        </div>
    </div>

</body>
</html>
